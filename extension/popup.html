<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XBoard Saver</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="logo">X</div>
        <div>
          <h1>XBoard Saver</h1>
          <p>保存 X 推文到自己的看板</p>
        </div>
      </header>

      <label for="server-url">XBoard 地址</label>
      <input id="server-url" type="url" placeholder="https://xboard.example.com" />

      <label for="api-token">API Token</label>
      <input id="api-token" type="password" placeholder="xb_..." />

      <div class="section-title">
        <label for="urls">推文链接</label>
        <button id="use-current" class="text-button" type="button">使用当前页面</button>
      </div>
      <textarea id="urls" rows="5" placeholder="每行一个 X 推文链接"></textarea>

      <p id="status" role="status" aria-live="polite"></p>

      <div class="actions">
        <button id="save-config" class="secondary" type="button">保存配置</button>
        <button id="submit" class="primary" type="button">加入下载队列</button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
