<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XBoard Saver</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="logo">X</div>
        <div>
          <h1>XBoard Saver</h1>
          <p>推文上点图标即可保存</p>
        </div>
      </header>

      <label for="server-url">XBoard 地址</label>
      <input id="server-url" type="url" placeholder="https://xboard.example.com" />

      <label for="api-token">API Token</label>
      <input id="api-token" type="password" placeholder="xb_..." />

      <p id="status" role="status" aria-live="polite"></p>

      <div class="actions">
        <button id="test" class="secondary" type="button">测试连接</button>
        <button id="save-config" class="primary" type="button">保存</button>
      </div>

      <p class="hint">
        配置好后刷新 X 页面：每条推文的转发 / 点赞那一行末尾会多一个归档图标，
        点它直接把链接推进下载队列。
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
