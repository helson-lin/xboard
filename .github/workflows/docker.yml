name: Docker image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test Python backend in isolated directories
        env:
          XBOARD_DATA_DIR: ${{ runner.temp }}/xboard-data
          XBOARD_CONFIG_DIR: ${{ runner.temp }}/xboard-config
          XBOARD_PASSWORD: ci-only-password
          XBOARD_API_TOKEN: ci-only-api-token
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Set lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: xboard-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name xboard-smoke -p 127.0.0.1:8765:8765 \
            -e XBOARD_PASSWORD=ci-only-password -e XBOARD_API_TOKEN=ci-only-api-token xboard-api:ci
          trap 'docker logs xboard-smoke; docker rm -f xboard-smoke' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/healthz; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:8765/public/posts
          curl --fail --silent http://127.0.0.1:8765/admin | grep --quiet 'id="root"'
          curl --fail --silent --output /dev/null \
            -H 'Authorization: Bearer ci-only-api-token' \
            http://127.0.0.1:8765/api/plugin/download
          docker exec xboard-smoke ffmpeg -version
          docker exec xboard-smoke python -m yt_dlp --version
          docker exec xboard-smoke test -f /etc/xboard/tag_rules.json
          test "$(docker inspect --format '{{.Config.User}}' xboard-smoke)" = '10001:10001'
          docker exec xboard-smoke test ! -e /etc/xboard/storage.json
      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
